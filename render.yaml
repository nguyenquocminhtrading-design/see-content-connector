# ==============================================================================
# RENDER.COM BLUEPRINT SPECIFICATION (Infrastructure as Code)
# SEE Content Connector — Multi-platform Social Content Hub
# ==============================================================================
# In Render Dashboard: New + -> Blueprint -> Connect your GitHub repo.
# Render will automatically provision the PostgreSQL database, Backend API,
# and Frontend web service with all environment links configured.

services:
  # ----------------------------------------------------------------------------
  # 1. BACKEND API & SYNC WORKER SERVICE
  # ----------------------------------------------------------------------------
  - type: web
    name: see-content-connector-api
    runtime: node
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: see-content-connector-db
          property: connectionString
      - key: SYNC_INTERVAL_MINUTES
        value: 15
      # Meta & Social Credentials (fill in Render Dashboard after creation)
      - key: META_APP_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: META_PAGE_ID
        sync: false
      - key: META_PAGE_ACCESS_TOKEN
        sync: false
      - key: INSTAGRAM_BUSINESS_ACCOUNT_ID
        sync: false
      - key: TIKTOK_CLIENT_KEY
        sync: false
      - key: TIKTOK_CLIENT_SECRET
        sync: false
      - key: TIKTOK_REDIRECT_URI
        sync: false
      - key: LINKEDIN_CLIENT_ID
        sync: false
      - key: LINKEDIN_CLIENT_SECRET
        sync: false

  # ----------------------------------------------------------------------------
  # 2. FRONTEND DASHBOARD SERVICE (Next.js)
  # ----------------------------------------------------------------------------
  - type: web
    name: see-content-connector-web
    runtime: node
    region: singapore
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: BACKEND_URL
        fromService:
          type: web
          name: see-content-connector-api
          property: host

# ------------------------------------------------------------------------------
# 3. MANAGED POSTGRESQL DATABASE
# ------------------------------------------------------------------------------
databases:
  - name: see-content-connector-db
    databaseName: see_content_connector
    user: postgres
    region: singapore
    plan: free
